<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b1220" />
  <title>CS2 城市规划器 v0.5 iPad + Pencil</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root{
      --bg:#0b1020;--panel:#101827;--panel2:#182235;--line:#334155;--text:#e5e7eb;--muted:#94a3b8;
      --accent:#38bdf8;--ok:#34d399;--warn:#fbbf24;--danger:#fb7185;--btn:#223047;--btn2:#334155;
      --safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none;}
    #app{height:100dvh;display:grid;grid-template-rows:calc(54px + var(--safe-top)) 1fr calc(86px + var(--safe-bottom));}
    header{padding:calc(8px + var(--safe-top)) 12px 8px;display:flex;align-items:center;gap:10px;background:#08111f;border-bottom:1px solid var(--line);min-width:0;}
    h1{font-size:16px;margin:0;font-weight:800;white-space:nowrap;}
    .top-actions{display:flex;gap:8px;align-items:center;overflow-x:auto;margin-left:auto;padding-bottom:2px;}
    button,.file-label,select,input{border:1px solid var(--line);background:var(--btn);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;min-height:44px;}
    button,.file-label{cursor:pointer;user-select:none;white-space:nowrap;}
    button:active,.file-label:active{transform:translateY(1px);background:var(--btn2);}
    button.active{background:#075985;border-color:var(--accent);color:#e0f2fe;}
    button.danger{background:#451a25;border-color:#7f1d1d;color:#fecdd3;}
    input[type=file]{display:none;}
    .main{min-height:0;display:grid;grid-template-columns:260px 1fr 286px;}
    aside{min-height:0;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px;}
    aside.right{border-right:0;border-left:1px solid var(--line);}
    .canvas-wrap{position:relative;min-width:0;min-height:0;background:radial-gradient(circle at 50% 45%,#1a2941 0,#0d1424 55%,#070b16 100%);}
    canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;}
    .section{border:1px solid rgba(148,163,184,.18);background:rgba(15,23,42,.56);border-radius:16px;padding:12px;margin-bottom:12px;}
    .section-title{font-size:13px;font-weight:800;margin-bottom:10px;color:#f8fafc;display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .tool-grid button{min-height:48px;padding:8px 8px;font-size:13px;}
    .row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
    .row button{flex:1;}
    .check{display:flex;align-items:center;gap:8px;font-size:13px;color:#dbeafe;margin:8px 0;}
    .check input{width:20px;height:20px;min-height:20px;}
    small,.muted{color:var(--muted);line-height:1.45;font-size:12px;}
    .bottom-bar{padding:10px 12px calc(10px + var(--safe-bottom));display:grid;grid-template-columns:auto 1fr auto;gap:10px;background:#08111f;border-top:1px solid var(--line);align-items:center;}
    .bottom-tools{display:flex;gap:8px;overflow-x:auto;align-items:center;}
    .bottom-tools button{min-width:74px;min-height:54px;font-size:13px;padding:6px 8px;}
    .draw-actions{display:flex;gap:8px;}
    .draw-actions button{min-height:54px;min-width:86px;font-weight:700;}
    .mode-chip{border:1px solid rgba(148,163,184,.28);background:rgba(15,23,42,.75);border-radius:16px;padding:8px 12px;min-width:138px;}
    .mode-chip strong{display:block;font-size:13px;}.mode-chip span{display:block;font-size:12px;color:var(--muted);margin-top:2px;}
    .status-bar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;}
    .status-chip{background:rgba(15,23,42,.88);border:1px solid rgba(148,163,184,.28);border-radius:999px;padding:8px 10px;font-size:12px;color:#e2e8f0;backdrop-filter:blur(8px);}
    .toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#020617;border:1px solid rgba(148,163,184,.35);border-radius:999px;padding:9px 14px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:10;}
    .toast.show{opacity:1;}
    .score{font-size:44px;font-weight:900;line-height:1;margin:4px 0 8px;}.good{color:var(--ok)}.mid{color:var(--warn)}.bad{color:var(--danger)}
    .metric{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid rgba(148,163,184,.12);font-size:13px;color:#cbd5e1;}.metric:last-child{border-bottom:0;}
    .warnbox,.okbox{border-radius:12px;padding:10px;margin:8px 0;font-size:13px;line-height:1.45;}.warnbox{background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.25);color:#fde68a}.okbox{background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.25);color:#bbf7d0}
    .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(148,163,184,.18);border-radius:999px;padding:5px 8px;font-size:12px;color:#dbeafe;margin:3px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
    @media(max-width:1100px){.main{grid-template-columns:0 1fr 0}.desktop-only{display:none!important}aside{display:none}.top-actions button,.top-actions .file-label{font-size:13px;padding:8px 10px;min-height:42px}h1{font-size:14px}.bottom-bar{grid-template-columns:1fr}.mode-chip{position:absolute;left:12px;top:68px;z-index:4;background:rgba(2,6,23,.82);backdrop-filter:blur(8px)}.draw-actions{position:absolute;right:12px;top:68px;z-index:4}.bottom-tools button{min-width:78px}}
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>CS2 城市规划器 v0.5 iPad + Pencil</h1>
    <div class="top-actions">
      <label class="file-label" for="bgFile">导入图片</label><input id="bgFile" type="file" accept="image/png,image/jpeg,image/webp" />
      <label class="file-label" for="pdfFile">导入 PDF</label><input id="pdfFile" type="file" accept="application/pdf,.pdf" />
      <label class="file-label" for="projectFile">打开工程</label><input id="projectFile" type="file" accept="application/json,.json" />
      <button id="saveProject">保存工程</button><button id="exportPng">导出 PNG</button>
    </div>
  </header>
  <div class="main">
    <aside class="desktop-only">
      <div class="section"><div class="section-title">导入 / PDF</div>
        <div class="row"><button id="prevPdf">上一页</button><button id="nextPdf">下一页</button></div>
        <div class="row"><span class="muted">页码</span><input id="pdfPageInput" type="number" min="1" value="1" style="width:74px"><button id="goPdf">跳转</button></div>
        <div class="row"><select id="pdfQuality"><option value="2.5">流畅 2.5×</option><option value="3" selected>高清 3×</option><option value="4">超清 4×</option></select><button id="rerenderPdf">重渲染</button></div>
        <small>iPad 建议 3×；4× 更清晰但更吃内存。只渲染当前页。</small>
      </div>
      <div class="section"><div class="section-title">工具</div><div id="sideTools" class="tool-grid"></div></div>
      <div class="section"><div class="section-title">图层</div>
        <label class="check"><input type="checkbox" id="showBg" checked> 显示底图</label>
        <label class="check"><input type="checkbox" id="showRoads" checked> 道路/轨道</label>
        <label class="check"><input type="checkbox" id="showZones" checked> 分区</label>
        <label class="check"><input type="checkbox" id="showServices" checked> 服务设施</label>
        <label class="check"><input type="checkbox" id="showCovers" checked> 覆盖圈</label>
        <label class="check"><input type="checkbox" id="showLabels" checked> 标签</label>
      </div>
      <div class="section"><div class="section-title">iPad 手势</div><small>Apple Pencil/单指：按当前工具绘制。双指：缩放和平移。底部按钮完成/撤销/取消，不依赖键盘。长按对象可删除。</small></div>
    </aside>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas"></canvas><div id="toast" class="toast"></div>
      <div class="status-bar"><div class="status-chip" id="statusLeft">导入图片或 PDF 开始规划</div><div class="status-chip" id="statusRight">缩放 100%</div></div>
    </div>
    <aside class="right desktop-only">
      <div class="section"><div class="section-title">规划评分</div><div id="score" class="score mid">--</div><div id="metrics"></div></div>
      <div class="section"><div class="section-title">建议</div><div id="suggestions"><div class="warnbox">先导入底图，然后画主干路、分区和服务设施。</div></div></div>
      <div class="section"><div class="section-title">图例</div><div id="legend"></div></div>
    </aside>
  </div>
  <div class="bottom-bar">
    <div class="mode-chip"><strong id="modeName">移动地图</strong><span id="modeHint">双指缩放 / 单指移动</span></div>
    <div class="bottom-tools" id="bottomTools"></div>
    <div class="draw-actions"><button id="undoPoint">撤销点</button><button id="finishShape" class="active">完成</button><button id="cancelShape" class="danger">取消</button></div>
  </div>
</div>
<script>
if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),wrap=document.getElementById('canvasWrap');
const DPR=()=>Math.max(1,Math.min(2.5,window.devicePixelRatio||1));
const state={bg:null,bgInfo:null,pdf:null,pdfBytes:null,pdfPage:1,pdfPages:0,pdfScale:3,view:{x:0,y:0,scale:1},tool:'pan',draft:[],roads:[],zones:[],services:[],selected:null,lastSave:0};
const colors={highway:'#fb7185',arterial:'#f97316',collector:'#facc15',street:'#94a3b8',rail:'#a78bfa',resLow:'#22c55e',resHigh:'#16a34a',commercial:'#38bdf8',industrial:'#eab308',office:'#60a5fa',mixed:'#f472b6',school:'#34d399',hospital:'#f87171',fire:'#fb923c',police:'#818cf8',park:'#4ade80'};
const labels={pan:'移动地图',highway:'高速',arterial:'主干路',collector:'次干路',street:'街区路',rail:'轨道/货运',resLow:'低密住宅',resHigh:'高密住宅',commercial:'商业区',industrial:'工业区',office:'办公区',mixed:'混合区',school:'学校',hospital:'医院',fire:'消防',police:'警察',park:'公园',erase:'橡皮擦'};
const tools=['pan','highway','arterial','collector','street','rail','resLow','resHigh','commercial','industrial','office','mixed','school','hospital','fire','police','park','erase'];
const lineTools=new Set(['highway','arterial','collector','street','rail']);
const zoneTools=new Set(['resLow','resHigh','commercial','industrial','office','mixed']);
const serviceTools=new Set(['school','hospital','fire','police','park']);
const layerIds=['showBg','showRoads','showZones','showServices','showCovers','showLabels'];
function el(id){return document.getElementById(id)}
function toast(t){const e=el('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1600)}
function resize(){const dpr=DPR();const r=wrap.getBoundingClientRect();canvas.width=Math.max(1,Math.floor(r.width*dpr));canvas.height=Math.max(1,Math.floor(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
window.addEventListener('resize',resize,{passive:true});
function screenToWorld(x,y){return{x:(x-state.view.x)/state.view.scale,y:(y-state.view.y)/state.view.scale}}
function worldToScreen(p){return{x:p.x*state.view.scale+state.view.x,y:p.y*state.view.scale+state.view.y}}
function fitToBg(){if(!state.bg)return;const r=wrap.getBoundingClientRect();const s=Math.min(r.width/state.bg.width,r.height/state.bg.height)*.92;state.view.scale=s;state.view.x=(r.width-state.bg.width*s)/2;state.view.y=(r.height-state.bg.height*s)/2;draw();}
function draw(){const r=wrap.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.save();ctx.translate(state.view.x,state.view.y);ctx.scale(state.view.scale,state.view.scale);drawGrid();if(el('showBg')?.checked!==false&&state.bg){ctx.drawImage(state.bg,0,0)} if(el('showZones')?.checked!==false)state.zones.forEach(z=>drawZone(z)); if(el('showRoads')?.checked!==false)state.roads.forEach(rd=>drawRoad(rd)); if(el('showCovers')?.checked!==false)state.services.forEach(s=>drawCover(s)); if(el('showServices')?.checked!==false)state.services.forEach(s=>drawService(s)); drawDraft();ctx.restore();el('statusRight').textContent='缩放 '+Math.round(state.view.scale*100)+'%';updateScore();}
function drawGrid(){if(state.bg)return;ctx.strokeStyle='rgba(148,163,184,.10)';ctx.lineWidth=1/state.view.scale;const step=80;for(let x=-4000;x<8000;x+=step){ctx.beginPath();ctx.moveTo(x,-4000);ctx.lineTo(x,8000);ctx.stroke()}for(let y=-4000;y<8000;y+=step){ctx.beginPath();ctx.moveTo(-4000,y);ctx.lineTo(8000,y);ctx.stroke()}}
function drawRoad(rd){ctx.strokeStyle=colors[rd.type]||'#fff';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=({highway:9,arterial:7,collector:5,street:3,rail:5}[rd.type]||4);ctx.beginPath();rd.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();if(el('showLabels')?.checked!==false&&rd.points.length>1)labelAt(rd.points[0],labels[rd.type])}
function drawZone(z){ctx.fillStyle=hexA(colors[z.type]||'#fff',.25);ctx.strokeStyle=colors[z.type]||'#fff';ctx.lineWidth=2/state.view.scale;ctx.beginPath();z.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fill();ctx.stroke();if(el('showLabels')?.checked!==false)labelAt(centroid(z.points),labels[z.type])}
function drawCover(s){ctx.fillStyle=hexA(colors[s.type]||'#fff',.10);ctx.strokeStyle=hexA(colors[s.type]||'#fff',.32);ctx.lineWidth=1.5/state.view.scale;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();ctx.stroke()}
function drawService(s){ctx.fillStyle=colors[s.type]||'#fff';ctx.strokeStyle='#020617';ctx.lineWidth=3/state.view.scale;ctx.beginPath();ctx.arc(s.x,s.y,10/state.view.scale+8,0,Math.PI*2);ctx.fill();ctx.stroke();if(el('showLabels')?.checked!==false)labelAt({x:s.x+14/state.view.scale,y:s.y},labels[s.type])}
function drawDraft(){if(!state.draft.length)return;ctx.strokeStyle=colors[state.tool]||'#fff';ctx.fillStyle=hexA(colors[state.tool]||'#fff',.18);ctx.lineWidth=3/state.view.scale;ctx.setLineDash([8/state.view.scale,6/state.view.scale]);ctx.beginPath();state.draft.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));if(zoneTools.has(state.tool)&&state.draft.length>2){ctx.closePath();ctx.fill()}ctx.stroke();ctx.setLineDash([]);state.draft.forEach(p=>{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,5/state.view.scale,0,Math.PI*2);ctx.fill()})}
function labelAt(p,t){ctx.save();ctx.font=`${12/state.view.scale}px system-ui`;const pad=4/state.view.scale,w=ctx.measureText(t).width+pad*2,h=18/state.view.scale;ctx.fillStyle='rgba(2,6,23,.72)';ctx.fillRect(p.x,p.y-h/2,w,h);ctx.fillStyle='#e5e7eb';ctx.fillText(t,p.x+pad,p.y+4/state.view.scale);ctx.restore()}
function hexA(hex,a){let h=hex.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function centroid(pts){let x=0,y=0;pts.forEach(p=>{x+=p.x;y+=p.y});return{x:x/pts.length,y:y/pts.length}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function setTool(t){state.tool=t;state.draft=[];document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));el('modeName').textContent=labels[t];el('modeHint').textContent=t==='pan'?'单指移动，双指缩放':t==='erase'?'点选对象删除':'Pencil/单指添加点，底部按钮完成';draw()}
function makeTools(){const groups=[el('sideTools'),el('bottomTools')].filter(Boolean);groups.forEach(g=>{g.innerHTML='';tools.forEach(t=>{const b=document.createElement('button');b.textContent=labels[t];b.dataset.tool=t;b.onclick=()=>setTool(t);g.appendChild(b)})});setTool('pan');}
makeTools();
layerIds.forEach(id=>el(id)?.addEventListener('change',draw));
el('finishShape').onclick=finishDraft;el('undoPoint').onclick=()=>{state.draft.pop();draw()};el('cancelShape').onclick=()=>{state.draft=[];draw()};
function finishDraft(){if(lineTools.has(state.tool)&&state.draft.length>=2){state.roads.push({type:state.tool,points:[...state.draft]});state.draft=[];saveLocal();draw();toast('已完成道路')}else if(zoneTools.has(state.tool)&&state.draft.length>=3){state.zones.push({type:state.tool,points:[...state.draft]});state.draft=[];saveLocal();draw();toast('已完成分区')}else{toast('点数不够')}}
function addWorldPoint(p){if(lineTools.has(state.tool)||zoneTools.has(state.tool)){state.draft.push(p);draw()}else if(serviceTools.has(state.tool)){state.services.push({type:state.tool,x:p.x,y:p.y,r:serviceRadius(state.tool)});saveLocal();draw();toast('已放置 '+labels[state.tool])}else if(state.tool==='erase'){eraseAt(p)}}
function serviceRadius(t){return{school:260,hospital:360,fire:300,police:320,park:220}[t]||260}
function eraseAt(p){let best=null;state.services.forEach((s,i)=>{const d=dist(p,s);if(d<30&&(best==null||d<best.d))best={kind:'service',i,d}});state.roads.forEach((rd,i)=>{for(let j=1;j<rd.points.length;j++){const d=segDist(p,rd.points[j-1],rd.points[j]);if(d<18&&(best==null||d<best.d))best={kind:'road',i,d}}});state.zones.forEach((z,i)=>{if(pointInPoly(p,z.points)&&(best==null||80<best.d))best={kind:'zone',i,d:80}});if(best){state[best.kind+'s'].splice(best.i,1);saveLocal();draw();toast('已删除')}else toast('没点中对象')}
function segDist(p,a,b){const l2=(b.x-a.x)**2+(b.y-a.y)**2;if(!l2)return dist(p,a);let t=((p.x-a.x)*(b.x-a.x)+(p.y-a.y)*(b.y-a.y))/l2;t=Math.max(0,Math.min(1,t));return dist(p,{x:a.x+t*(b.x-a.x),y:a.y+t*(b.y-a.y)})}
function pointInPoly(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){if(((poly[i].y>p.y)!=(poly[j].y>p.y))&&(p.x<(poly[j].x-poly[i].x)*(p.y-poly[i].y)/(poly[j].y-poly[i].y)+poly[i].x))c=!c}return c}
const pointers=new Map();let lastTap=0, longTimer=null, panStart=null, pinchStart=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,type:e.pointerType});clearTimeout(longTimer);if(pointers.size===1){panStart={x:e.clientX,y:e.clientY,vx:state.view.x,vy:state.view.y};longTimer=setTimeout(()=>{if(state.tool!=='pan'){eraseAt(screenToWorld(e.clientX-wrap.getBoundingClientRect().left,e.clientY-wrap.getBoundingClientRect().top))}},650)}else if(pointers.size===2){pinchStart=pinchInfo();}}, {passive:false});
canvas.addEventListener('pointermove',e=>{const p=pointers.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;clearTimeout(longTimer);if(pointers.size===2&&pinchStart){const now=pinchInfo();const ratio=now.d/pinchStart.d;zoomAt(now.cx-wrap.getBoundingClientRect().left,now.cy-wrap.getBoundingClientRect().top,pinchStart.scale*ratio,false);state.view.x=pinchStart.vx+(now.cx-pinchStart.cx);state.view.y=pinchStart.vy+(now.cy-pinchStart.cy);draw();return}if(pointers.size===1&&state.tool==='pan'&&panStart){state.view.x=panStart.vx+(e.clientX-panStart.x);state.view.y=panStart.vy+(e.clientY-panStart.y);draw();}}, {passive:false});
canvas.addEventListener('pointerup',e=>{clearTimeout(longTimer);const p=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(!p)return;const moved=Math.hypot(e.clientX-p.px,e.clientY-p.py);const rect=wrap.getBoundingClientRect();if(moved<10&&pointers.size===0){const now=Date.now();if(now-lastTap<320&&(lineTools.has(state.tool)||zoneTools.has(state.tool))){finishDraft()}else if(state.tool!=='pan'){addWorldPoint(screenToWorld(e.clientX-rect.left,e.clientY-rect.top))}lastTap=now}if(pointers.size<2)pinchStart=null;}, {passive:false});
canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);clearTimeout(longTimer)});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,state.view.scale*(e.deltaY>0?.9:1.1),true)},{passive:false});
function pinchInfo(){const arr=[...pointers.values()];const a=arr[0],b=arr[1];return{d:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,scale:state.view.scale,vx:state.view.x,vy:state.view.y}}
function zoomAt(sx,sy,newScale,redraw=true){newScale=Math.max(.05,Math.min(12,newScale));const w=screenToWorld(sx,sy);state.view.scale=newScale;state.view.x=sx-w.x*newScale;state.view.y=sy-w.y*newScale;if(redraw)draw()}
async function loadImageFile(file){const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{state.bg=img;state.bgInfo={type:'image',name:file.name};fitToBg();saveLocal();toast('图片已导入')};img.src=url}
el('bgFile').onchange=e=>{const f=e.target.files[0];if(f)loadImageFile(f)};
el('pdfFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;state.pdfBytes=await f.arrayBuffer();state.pdf=await pdfjsLib.getDocument({data:state.pdfBytes}).promise;state.pdfPages=state.pdf.numPages;state.pdfPage=1;el('pdfPageInput').value=1;await renderPdf();};
async function renderPdf(){if(!state.pdf)return toast('请先导入 PDF');state.pdfScale=parseFloat(el('pdfQuality')?.value||'3');const page=await state.pdf.getPage(state.pdfPage);const vp=page.getViewport({scale:state.pdfScale});const off=document.createElement('canvas');off.width=vp.width;off.height=vp.height;await page.render({canvasContext:off.getContext('2d'),viewport:vp}).promise;const img=new Image();img.onload=()=>{state.bg=img;state.bgInfo={type:'pdf',page:state.pdfPage,pages:state.pdfPages,scale:state.pdfScale};fitToBg();saveLocal();toast(`PDF 第 ${state.pdfPage}/${state.pdfPages} 页已渲染`)};img.src=off.toDataURL('image/png');}
el('prevPdf').onclick=async()=>{if(state.pdf&&state.pdfPage>1){state.pdfPage--;el('pdfPageInput').value=state.pdfPage;await renderPdf()}};
el('nextPdf').onclick=async()=>{if(state.pdf&&state.pdfPage<state.pdfPages){state.pdfPage++;el('pdfPageInput').value=state.pdfPage;await renderPdf()}};
el('goPdf').onclick=async()=>{if(!state.pdf)return;const n=Math.max(1,Math.min(state.pdfPages,parseInt(el('pdfPageInput').value||1)));state.pdfPage=n;el('pdfPageInput').value=n;await renderPdf()};
el('rerenderPdf').onclick=renderPdf;
function updateScore(){const scoreEl=el('score'),metrics=el('metrics'),sugg=el('suggestions'),legend=el('legend');if(!scoreEl)return;let score=100,w=[];const main=state.roads.filter(r=>['highway','arterial'].includes(r.type)).length;const zones=state.zones.length,services=state.services.length;if(main<2&&zones>2){score-=15;w.push('主干路/高速偏少，建议先搭骨架路网。')}if(state.zones.some(z=>z.type==='industrial')&&!state.roads.some(r=>r.type==='highway')){score-=18;w.push('工业区最好单独接高速或货运通道。')}if(state.zones.some(z=>z.type.includes('res'))&&!state.services.some(s=>s.type==='park')){score-=10;w.push('住宅区缺少公园覆盖。')}if(state.zones.some(z=>z.type==='resHigh')&&!state.services.some(s=>['fire','hospital'].includes(s.type))){score-=14;w.push('高密住宅建议优先补消防/医院。')}score=Math.max(0,score);scoreEl.textContent=state.bg?score:'--';scoreEl.className='score '+(score>=80?'good':score>=60?'mid':'bad');metrics.innerHTML=`<div class="metric"><span>道路/轨道</span><b>${state.roads.length}</b></div><div class="metric"><span>分区</span><b>${zones}</b></div><div class="metric"><span>服务设施</span><b>${services}</b></div><div class="metric"><span>草稿点</span><b>${state.draft.length}</b></div>`;sugg.innerHTML=w.length?w.map(x=>`<div class="warnbox">${x}</div>`).join(''):'<div class="okbox">当前规划结构比较健康，可以继续细化路网和公共服务。</div>';legend.innerHTML=Object.entries(labels).filter(([k])=>colors[k]).map(([k,v])=>`<span class="pill"><i class="dot" style="background:${colors[k]}"></i>${v}</span>`).join('')}
function serializable(){return{version:'0.5-ipad-pencil',bgInfo:state.bgInfo,view:state.view,roads:state.roads,zones:state.zones,services:state.services}}
function saveLocal(){try{localStorage.setItem('cs2planner_v05_autosave',JSON.stringify(serializable()));}catch(e){}}
setInterval(saveLocal,10000);
el('saveProject').onclick=()=>{const blob=new Blob([JSON.stringify(serializable(),null,2)],{type:'application/json'});downloadBlob(blob,'cs2_planner_project_v05.json')};
el('exportPng').onclick=()=>{const a=document.createElement('a');a.download='cs2_planner_view.png';a.href=canvas.toDataURL('image/png');a.click()};
el('projectFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);state.roads=d.roads||[];state.zones=d.zones||[];state.services=d.services||[];state.view=d.view||state.view;state.bgInfo=d.bgInfo||null;toast('工程已打开；如需底图请重新导入图片/PDF');draw()}catch(err){toast('工程文件无法读取')}};r.readAsText(f)};
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function initFromLocal(){try{const d=JSON.parse(localStorage.getItem('cs2planner_v05_autosave')||'null');if(d){state.roads=d.roads||[];state.zones=d.zones||[];state.services=d.services||[];state.view=d.view||state.view;state.bgInfo=d.bgInfo||null;toast('已恢复上次草稿；底图需重新导入');}}catch(e){}}
initFromLocal();resize();
</script>
</body>
</html>
